service: emushafnet

image: lrajhhbgjtvv/emushafnet

servers:
  web:
    - <%= ENV['DEPLOY_HOST'] %>
proxy:
  hosts:
<% ENV.fetch('PROXY_HOSTS', 'emushaf.net,www.emushaf.net').split(',').each do |h| %>
    - <%= h.strip %>
<% end %>
  ssl: <%= ENV.fetch('PROXY_SSL', 'true') %>
  forward_headers: true
  healthcheck:
    path: "/"
registry:
  server: lhr.ocir.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: arm64
  local: true
  context: .
aliases:
  apps: server exec docker exec kamal-proxy kamal-proxy list
ssh:
  user: kamal